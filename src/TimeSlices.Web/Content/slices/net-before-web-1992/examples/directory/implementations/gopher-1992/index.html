<!DOCTYPE html>
<!-- Средство визуализации, не код эпохи: имитация текстового клиента Gopher 1992 года.
     Показываемый код — code/menu.txt; его копия ниже (id="menus") должна совпадать с ним дословно. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Справочник: меню Gopher, 1992</title>
<style>
  body { margin: 0; background: #000; color: #e0e0e0; font: 15px/1.35 monospace; }
  #screen { margin: 0; padding: 12px 16px; white-space: pre-wrap; min-height: 20em; }
  #screen .item { cursor: pointer; }
  #screen .item:hover { color: #fff; text-decoration: underline; }
  #wire { margin: 0; padding: 6px 16px; color: #8fd; background: #0a1a1a; white-space: pre-wrap; }
  #bar { padding: 8px 16px; background: #222; color: #ddd; font: 14px sans-serif; }
  input, button { font: inherit; }
</style>
</head>
<body>
<pre id="screen"></pre>
<pre id="wire"></pre>
<form id="bar">
  <label><span id="label">Номер пункта:</span> <input id="input" size="20" autocomplete="off" autofocus></label>
  <button type="submit">Ввод</button>
  <span id="hint">u — на меню вверх</span>
</form>
<script type="text/plain" id="menus" data-code="code/menu.txt">1О кафедре	/about	gopher.phys.example.edu	70
1Сотрудники	/staff	gopher.phys.example.edu	70
2Телефонный справочник		ns.phys.example.edu	105
1Другие университеты	/	gopher.list.example.org	70
.
0Список сотрудников	/staff/staff.txt	gopher.phys.example.edu	70
2Телефонный справочник		ns.phys.example.edu	105
.
</script>
<script src="gopher.js"></script>
</body>
</html>
