<!DOCTYPE html>
<!-- Средство визуализации, не код эпохи: учебная машина с хранимой программой (не EDSAC и не эмуляция
     настоящей машины, CLAUDE.md). Показываемый код — code/squares.txt; его копия ниже (id="program")
     должна совпадать с ним дословно (ADR 0006): машина загружает память из этой копии. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таблица квадратов: учебная машина, 1949</title>
<style>
  body { margin: 0; padding: 8px 12px; font: 14px/1.35 system-ui, sans-serif; background: #fbfaf6; color: #222; }
  #top { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-end; }
  .reg { border: 1px solid #998; background: #fff; padding: 3px 8px; min-width: 7.5em; }
  .reg b { display: block; font-size: 11px; font-weight: normal; color: #665; }
  .reg span { font: 18px monospace; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  button { font: inherit; padding: 2px 10px; }
  fieldset { display: inline; border: 1px solid #ccb; padding: 0 8px 2px; margin: 0; }
  #status { min-height: 2.7em; margin: 4px 0 6px; }
  #status.error { color: #a00; }
  #memory { border-collapse: collapse; font: 12px monospace; }
  #memory td { border: 1px solid #ddd; padding: 1px 4px; width: 5.6em; vertical-align: top; background: #fff; }
  #memory td i { font-style: normal; color: #998; font-size: 10px; }
  #memory td .w { color: #555; float: right; }
  #memory td.prog { background: #eef3ff; }
  #memory td.data { background: #f2fbef; }
  #memory td.pc { outline: 2px solid #2650c9; outline-offset: -2px; }
  #memory td.changed { background: #ffe9a8; }
  #memory td.toggled { outline: 2px dashed #c05a00; outline-offset: -2px; }
  #legend { font-size: 12px; color: #555; margin: 4px 0; }
  #legend span { padding: 0 4px; border: 1px solid #ddd; }
  #printer { font: 12px monospace; color: #333; }
</style>
</head>
<body>
<div id="top">
  <div class="reg"><b>Аккумулятор</b><span id="acc">0</span></div>
  <div class="reg"><b>Счётчик команд</b><span id="pc">0</span></div>
  <div class="reg"><b>Регистр команды</b><span id="ir">—</span></div>
  <div class="reg"><b>Тактов</b><span id="ticks">0</span></div>
  <div class="reg"><b>Время при ~600 команд/с</b><span id="time">0 мс</span></div>
</div>
<div id="controls">
  <button type="button" id="step">Такт</button>
  <button type="button" id="run">Пуск</button>
  <button type="button" id="reset">Сброс</button>
  <fieldset><legend>Таблица</legend>
    <label><input type="radio" name="n" value="9" checked> 10 квадратов</label>
    <label><input type="radio" name="n" value="99"> 100 квадратов</label>
  </fieldset>
</div>
<p id="status" aria-live="polite">Программа загружена: 0–16 — команды, 20–25 — числа, 28–37 — пустая таблица.</p>
<p id="legend">В ячейке: <i>адрес</i>, буквенная запись слова и само слово (число).
  <span style="background:#eef3ff">команды</span> <span style="background:#f2fbef">числа</span>
  <span style="outline:2px solid #2650c9">счётчик команд</span> <span style="background:#ffe9a8">записано последним тактом</span></p>
<table id="memory" aria-label="Память: 128 ячеек"></table>
<p id="printer"></p>
<script type="text/plain" id="program" data-code="code/squares.txt">Таблица квадратов через разности: (n + 1)² = n² + (2n + 1). Только сложение.
Учебная машина: слово команды = код операции × 1000 + адрес.
Коды операций: Z 0, A 1, S 2, T 3, U 4, E 5, G 6, O 7.

Адрес  Команда  Слово  Смысл
    0  T 25      3025  очистить аккумулятор
    1  A 20      1020  взять текущий квадрат
    2  T 28      3028  записать в таблицу — эту команду программа меняет
    3  A 2       1002  взять саму команду из ячейки 2 как число
    4  A 24      1024  прибавить 1 — адрес в команде сдвинулся
    5  T 2       3002  вернуть команду на место: теперь T 29
    6  A 20      1020  квадрат += разность
    7  A 21      1021
    8  T 20      3020
    9  A 21      1021  разность += 2
   10  A 23      1023
   11  T 21      3021
   12  A 22      1022  счётчик −= 1
   13  S 24      2024
   14  U 22      4022
   15  E 0       5000  если счётчик ≥ 0 — следующий проход
   16  Z            0  стоп

Адрес  Число  Смысл
   20      0  текущий квадрат
   21      1  разность
   22      9  счётчик: N − 1 (10 квадратов — 9, 100 квадратов — 99)
   23      2  константа 2
   24      1  константа 1
   25      0  рабочая
28–37      0  таблица (для 100 квадратов — 28–127), в начале пустая
</script>
<script src="machine.js"></script>
</body>
</html>
